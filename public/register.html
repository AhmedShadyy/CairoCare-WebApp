<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cairo Care</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="page-auth">
    <nav class="navbar">
        <div class="brand">
            <img src="assets/logo.png" alt="Cairo Care Logo" class="brand-logo">
            Cairo Care
        </div>
        <div id="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="login.html" data-i18n="login">Login</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px; margin: 50px auto;"> <!-- Centered -->
        <div class="card">
            <h2 class="text-center" data-i18n="create_account">Create Account</h2>
            <div id="alert-box" class="text-center" style="color: red; margin-bottom: 15px;"></div>
            <form id="register-form" autocomplete="off">
                <div class="form-group">
                    <label data-i18n="role">Role</label>
                    <select name="role" id="role-select" onchange="toggleFields()">
                        <option value="patient" data-i18n="patient_role">Patient</option>
                        <option value="doctor" data-i18n="doctor_role">Doctor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="full_name">Full Name</label>
                    <input type="text" name="name" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label data-i18n="email">Email</label>
                    <input type="email" name="email" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label data-i18n="password">Password</label>
                    <input type="password" name="password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label data-i18n="phone">Phone</label>
                    <input type="text" name="phone" autocomplete="off">
                </div>

                <!-- Patient Fields -->
                <div id="patient-fields">
                    <div class="form-group">
                        <label data-i18n="dob">Date of Birth</label>
                        <input type="date" name="date_of_birth" autocomplete="off">
                    </div>
                </div>

                <!-- Doctor Fields -->
                <div id="doctor-fields" style="display: none;">
                    <div class="form-group">
                        <label data-i18n="specialization">Specialization</label>
                        <select name="specialization" required>
                            <option value="general" data-i18n="general">General</option>
                            <option value="cardiology" data-i18n="cardiology">Cardiology</option>
                            <option value="dermatology" data-i18n="dermatology">Dermatology</option>
                            <option value="pediatrics" data-i18n="pediatrics">Pediatrics</option>
                            <option value="neurology" data-i18n="neurology">Neurology</option>
                            <option value="bones" data-i18n="bones">Bones</option>
                            <option value="dentist" data-i18n="dentist">Dentist</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="fees">Consultation Fee (EGP)</label>
                        <input type="number" name="consultation_fee" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label data-i18n="bio">Bio</label>
                        <textarea name="bio"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%"
                    data-i18n="register_btn">Register</button>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js?v=3.4"></script>
    <script src="assets/js/auth.js?v=3.4"></script>
    <script>
        function toggleFields() {
            const role = document.getElementById('role-select').value;
            document.getElementById('patient-fields').style.display = role === 'patient' ? 'block' : 'none';
            document.getElementById('doctor-fields').style.display = role === 'doctor' ? 'block' : 'none';
        }
    </script>
</body>

</html>
